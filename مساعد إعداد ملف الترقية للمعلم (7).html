// محرك الصياغة التربوية الذكي المدمج + دعم اختياري لـ Gemini
function localPedagogicalEnhance(text, isImpact){
  if(!text) return "";
  let t = text.trim();
  if(isImpact){
    t = t.replace(/^(أثر|الأثر|أدى إلى|نتج عنه|كان الأثر|ساعد في|ساهم في)[:\s-]*/i, "");
    if(!t.includes("تحصيل") && !t.includes("نواتج") && !t.includes("مهارات") && !t.includes("دافعية")){
      t = "تحقيق نواتج التعلم المستهدفة، وتنمية المهارات الأساسية مع " + t;
    } else {
      t = "تعزيز دافعية الطلبة وتحسين نواتج التعلم من خلال " + t;
    }
    if(t.length > 135) t = t.slice(0, 132) + "...";
    return t;
  } else {
    t = t.replace(/^(قمت بـ|تم عمل|عملت على|قمت في|شاركت في|إعطاء)[:\s-]*/i, "");
    if(t.startsWith("تدريس")){
      t = t.replace(/^تدريس/, "توظيف استراتيجيات تدريس حديثة في");
    } else if(t.startsWith("شرح")){
      t = t.replace(/^شرح/, "تطبيق مواقف صفية تفاعلية لـ");
    } else if(t.startsWith("اختبار") || t.startsWith("امتحان")){
      t = t.replace(/^(اختبار|امتحان)/, "إعداد وتطبيق أدوات تقويم تكويني وواقعي لـ");
    } else if(t.startsWith("خطة")){
      t = t.replace(/^خطة/, "بناء وتنفيذ خطة إجرائية متكاملة لـ");
    } else if(!t.startsWith("تصميم") && !t.startsWith("تطبيق") && !t.startsWith("توظيف") && !t.startsWith("تفعيل") && !t.startsWith("بناء")){
      t = "تطبيق وتنفيذ " + t;
    }
    if(t.length > 215) t = t.slice(0, 212) + "...";
    return t;
  }
}

async function requestRewrite(fields){
  if(!fields.length) return toast('أدخل وصفاً أو أثراً أولاً');
  rewriteFields = fields;
  rewriteAbort = new AbortController();
  const ctl = rewriteAbort;
  showRewriteDialog('جارٍ تحسين الصياغة التربوية للمدخلات...');
  
  const inp = {};
  fields.forEach(f => inp[f.id] = f.text);
  
  const geminiKey = S.geminiKey || localStorage.getItem("tjo_gemini_key") || "";
  
  if(geminiKey && navigator.onLine){
    try {
      const prompt = "أنت خبير تربوي أردني في رتب المعلمين بوزارة التربية والتعليم. حسّن الصياغة التربوية لهذه الحقول بالفصحى وبإيجاز دقيق. لا تخترع أي أرقام أو وقائع جديدة. إذا كان الحقل وصف نشاط فاجعله أقل من 220 حرفاً بصيغة إجرائية، وإذا كان أثراً فأقل من 140 حرفاً مقاساً. أعد الإجابة ككائن JSON فقط بالمفاتيح نفسها:\n" + JSON.stringify(inp);
      
      const resp = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + encodeURIComponent(geminiKey), {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        }),
        signal: ctl.signal
      });
      
      if(resp.ok){
        const j = await resp.json();
        const rawText = j.candidates?.[0]?.content?.parts?.[0]?.text;
        if(rawText){
          const parsed = JSON.parse(rawText);
          const out = Object.keys(inp).filter(k => typeof parsed[k] === 'string' && parsed[k].trim() && parsed[k].trim() !== inp[k]).map(k => ({
            id: k,
            text: parsed[k].trim().slice(0, /:x$/.test(k) || /^activity:[^:]+:x/.test(k) ? 220 : /^activity:[^:]+:u/.test(k) ? 140 : 600)
          }));
          if(out.length){ showRewriteResult(out); return; }
        }
      }
    } catch(e) {
      console.warn("Fallback to local pedagogical engine", e);
    }
  }
  
  try {
    const out = [];
    for(const f of fields){
      const isImpact = /:u$/.test(f.id) || /impact$/.test(f.id);
      const enhanced = localPedagogicalEnhance(f.text, isImpact);
      if(enhanced && enhanced !== f.text){
        out.push({ id: f.id, text: enhanced });
      }
    }
    if(!out.length){
      showRewriteDialog('صياغتك الحالية واضحة ومناسبة؛ لا تحتاج تعديلاً.');
      return;
    }
    showRewriteResult(out);
  } catch(err){
    showRewriteDialog('تعذّر تحسين الصياغة؛ مدخلاتك محفوظة دون تغيير.');
  }
}
function showRewriteDialog(message){let d=$('#rewriteDialog');if(!d){d=document.createElement('dialog');d.id='rewriteDialog';document.body.appendChild(d)}d.innerHTML=`<h2>✨ مراجعة الصياغة التربوية</h2><p id=rewriteStatus>${e(message)}</p><div id=rewritePairs></div><button class="btn g" id=rewriteCancel>إلغاء</button>`;$('#rewriteCancel').onclick=()=>{try{rewriteAbort&&rewriteAbort.abort()}catch(e){}if(window.parent!==window)window.parent.postMessage({type:'portfolio-rewrite-stop'},location.origin);d.close()};if(!d.open)d.showModal()}
function showRewriteResult(fieldsArr){const suggestions=fieldsArr.filter(r=>rewriteFields.some(f=>f.id===r.id));showRewriteDialog('راجع كل اقتراح؛ لا يُعتمد أي تغيير إلا بموافقتك.');$('#rewritePairs').innerHTML=suggestions.map((r,i)=>{const f=rewriteFields.find(f=>f.id===r.id);return `<div class=rewrite-pair><label class=r><input type=checkbox id="accept-${i}" checked><b>اعتماد هذا الاقتراح</b></label><small>قبل</small><p>${e(f.text)}</p><small>بعد</small><p>${e(r.text)}</p></div>`}).join('');const b=document.createElement('button');b.className='btn';b.textContent='✓ اعتماد الصياغات المختارة';b.onclick=()=>{let changed=0;suggestions.forEach((r,i)=>{if(!$('#accept-'+i).checked)return;const original=rewriteFields.find(f=>f.id===r.id),parts=r.id.split(':');let current='',apply;if(parts[0]==='activity'){const d=curRD().det[parts[1]];if(!d)return;current=d[parts[2]];apply=()=>d[parts[2]]=r.text}else if(parts[0]==='support'){const a=supportItems(parts[1]).find(a=>a.id===parts[2]);if(!a)return;current=a[parts[3]];apply=()=>a[parts[3]]=r.text}else if(parts[0]==='profile'){current=S.f[parts[1]];apply=()=>S.f[parts[1]]=r.text}else if(parts[0]==='intervention'){current=S.ri[parts[1]];apply=()=>S.ri[parts[1]]=r.text}if(original&&current===original.text&&r.text){apply();changed++}});save();$('#rewriteDialog').close();go();toast(`تم اعتماد ${changed} صياغة؛ لم تتغير النقاط`)};$('#rewriteDialog').appendChild(b)}


function go(){const n=$("#n");if(false){n.innerHTML="";$("#v").innerHTML=`<div class=hero><div class=ic>📋</div><h2>جهّز ملف ترقيتك بخطوات بسيطة</h2><p>أداة تنظّم لك الملف وتوضّح أين وصلت، دون أي تسجيل.</p><ul class=pts><li>✅ لا إيميل ولا كلمة سر</li><li>✅ يُحفظ عملك تلقائياً على جهازك</li><li>✅ أغلب الأقسام مفتوحة للتعبئة والمعاينة مجاناً</li><li>🔒 الأقسام الثلاثة الأخيرة والتنزيل بالاشتراك</li></ul><button class="btn big" onclick="login()">ابدأ الآن</button><h3>خطواتك داخل الأداة</h3><ul class=steps><li>اختر رتبتك وافحص أهليتك</li><li>عبّئ ملف الإنجاز</li><li>تابع جاهزية ملفك قبل التقديم</li></ul></div>`;return}
n.innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};go();scrollTo(0,0)">${t}</button>`).join("");$("#v").innerHTML=[eligV,fileV,dashV,riV,accV][tab]()}
storageReady.then(()=>{if(!S.email)S.email="guest";S.f=S.f||{};S.rd=S.rd||{};S.ri=S.ri||{im:{}};go();saveStatus("✓ العمل المحفوظ جاهز");networkStatus()});
